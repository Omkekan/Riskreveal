# Local development infrastructure: PostgreSQL + Redis only.
#
# The API, Celery worker, and frontend run directly on your machine during
# early development — see the run commands in the project chat/docs — and
# get their own service blocks here once their Dockerfiles exist.
#
# IMPORTANT: run docker compose from *inside* this infra/ directory so it
# finds infra/.env automatically:
#   cd infra
#   docker compose up -d        # start
#   docker compose ps           # check health
#   docker compose down         # stop (keeps data)
#   docker compose down -v      # stop AND wipe the data volumes
name: riskreveal-v2
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riskreveal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskreveal}
      POSTGRES_DB: ${POSTGRES_DB:-riskreveal}
    ports:
      # Bound to loopback only — not reachable from other devices on your
      # network, even though the port is "published".
      - "127.0.0.1:5433:5432"
    volumes:
      - riskreveal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskreveal} -d ${POSTGRES_DB:-riskreveal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - riskreveal_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  riskreveal_pgdata:
  riskreveal_redisdata: