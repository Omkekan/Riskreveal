   [project]
   name = "riskreveal-backend"
   version = "0.1.0"
   description = "RiskReveal vulnerability scanner backend"
   requires-python = ">=3.12"
   dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "argon2-cffi>=25.1.0",
    "celery>=5.6.3",
    "cpe>=1.3.1",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "packaging>=26.3",
    "paramiko>=5.1.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pywinrm>=0.5.0",
    "redis>=8.1.0",
    "sentry-sdk>=2.73.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "univers>=32.0.1",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "testcontainers>=4.15.0",
]
